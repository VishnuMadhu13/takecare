apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: takecare-media
  namespace: takecare
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takecare
  namespace: takecare
  labels:
    app: takecare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: takecare
  template:
    metadata:
      labels:
        app: takecare
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: takecare
          image: vishnumadhu13/takecare:3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DEBUG
              value: "False"
            - name: ALLOWED_HOSTS
              value: "*"
            - name: RUN_MIGRATIONS
              value: "1"
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: takecare
            - name: DB_USER
              value: takecare
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: takecare-secret
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: takecare-secret
                  key: SECRET_KEY
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: media
              mountPath: /app/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: takecare-media